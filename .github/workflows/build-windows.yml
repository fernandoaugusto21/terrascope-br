name: Windows build

# A standalone terrascope.exe with this plugin, as a PyInstaller --onedir folder (core from the
# main branch of fernandoaugusto21/Terrascope), checked, zipped, and published as a GitHub release
# with its Scoop manifest. Pull requests build and check it without publishing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Branch, tag or full commit of fernandoaugusto21/Terrascope to build with
        required: false
        default: main
        type: string
  # Sent by the core repository when its main branch changes, with the commit in
  # client_payload.core (needs a token there; see README, "Windows build").
  repository_dispatch:
    types: [core-main]
  # Without that token: once a day, build when the core's main has moved.
  schedule:
    - cron: "17 6 * * *"

# One build at a time, so two publishes never race; none is cancelled.
concurrency:
  group: windows-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  CORE_REPO: fernandoaugusto21/Terrascope
  KEEP_RELEASES: 10

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      core_sha: ${{ steps.names.outputs.core_sha }}
      skip: ${{ steps.names.outputs.skip }}
      latest: ${{ steps.names.outputs.latest }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Name the build
        id: names
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # The commit the core sent, the ref asked by hand, or main.
          CORE_REF: ${{ github.event.client_payload.core || inputs.core_ref || 'main' }}
        run: |
          set -euo pipefail
          url="https://github.com/$CORE_REPO"
          if [[ "$CORE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            core_sha="$CORE_REF"
          else
            core_sha=$(git ls-remote "$url" "refs/heads/$CORE_REF" | cut -f1)
            if [ -z "$core_sha" ]; then   # a tag: the commit it points to
              core_sha=$(git ls-remote "$url" "refs/tags/$CORE_REF^{}" "refs/tags/$CORE_REF" | head -1 | cut -f1)
            fi
          fi
          if ! [[ "$core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no branch, tag or full commit '$CORE_REF' in $CORE_REPO"
            exit 1
          fi
          main_sha=$(git ls-remote "$url" refs/heads/main | cut -f1)
          latest=false
          if [ "$core_sha" = "$main_sha" ]; then latest=true; fi   # only a build of the core's main is "latest"
          br_sha=$(git rev-parse HEAD)
          tag="windows-${core_sha:0:7}-br${br_sha:0:7}"
          skip=false
          if [ "$EVENT" != "pull_request" ] && gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            skip=true   # this core and this plugin were built and published already
          fi
          {
            echo "core_sha=$core_sha"
            echo "tag=$tag"
            echo "skip=$skip"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "build $tag (core $core_sha, latest: $latest, skip: $skip)"

      - name: Install the core, the plugin and PyInstaller
        if: steps.names.outputs.skip != 'true'
        env:
          CORE_SHA: ${{ steps.names.outputs.core_sha }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "terrascope @ git+https://github.com/$CORE_REPO@$CORE_SHA"
          python -m pip install . pyinstaller
          python -m terrascope_br

      - name: Build terrascope.exe
        if: steps.names.outputs.skip != 'true'
        run: |
          cat > "$RUNNER_TEMP/entry.py" <<'PY'
          from terrascope.core.cli import run

          if __name__ == "__main__":
              run()
          PY
          # The entry points live in the packages' metadata: without --copy-metadata
          # the frozen app finds no plugin.
          # --onedir: dist/terrascope/ holds terrascope.exe and _internal/. A onefile exe unpacks
          # all of it to a temp folder on every start and deletes it on every exit.
          pyinstaller --clean --noconfirm --onedir --console --name terrascope \
            --copy-metadata terrascope --copy-metadata terrascope-br \
            --collect-all terrascope --collect-all terrascope_br \
            --collect-all numpy --collect-all PIL --collect-all yaml --collect-all tzdata \
            "$RUNNER_TEMP/entry.py"

      - name: Check the executable
        if: steps.names.outputs.skip != 'true'
        run: |
          dist/terrascope/terrascope.exe --version
          dist/terrascope/terrascope.exe --list-tabs | tee tabs.txt
          grep -q "plugin:terrascope-br" tabs.txt
          dist/terrascope/terrascope.exe --list-layers | tee layers.txt
          # The plugin's registered layers (the SP Águas gauges are inactive and must not be).
          for layer in br_ufs br_municipios br_fires br_quakes br_radar br_inmet_alerts br_inundation_cge \
                       br_global_rain br_global_temp br_viario; do
            grep -q "^$layer" layers.txt || { echo "::error::missing layer $layer"; exit 1; }
          done
          if grep -q "^br_gauges" layers.txt; then echo "::error::br_gauges is registered"; exit 1; fi

      - name: Zip and write the Scoop manifest
        if: steps.names.outputs.skip != 'true'
        env:
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          core_version=$(python -c "import importlib.metadata as m; print(m.version('terrascope'))")
          version="${core_version}-${TAG#windows-}"
          zip="terrascope-br_${version}_windows_x86_64.zip"
          mkdir -p release
          # The folder's contents go in at the root of the zip, so Scoop installs terrascope.exe
          # next to _internal/ and needs no extract_dir. The manifest script refuses a zip
          # without terrascope.exe at its root.
          (cd dist/terrascope && 7z a -tzip "../../release/$zip" ./* > /dev/null)
          # The manifest's file name is the Scoop app name: "terrascope-br", so it does
          # not clash with the core's own "terrascope" app.
          python packaging/windows/make_scoop_manifest.py --version "$version" --zip "release/$zip" \
            --url "https://github.com/${{ github.repository }}/releases/download/$TAG/$zip" \
            --output release/terrascope-br.json
          (cd release && sha256sum "$zip" > checksums.txt)

      - uses: actions/upload-artifact@v4
        if: steps.names.outputs.skip != 'true'
        with:
          name: windows-build
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read   # the titles of the merged pull requests (release name)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release

      - name: Name the release
        id: title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CORE_SHA: ${{ needs.build.outputs.core_sha }}
          BR_SHA: ${{ github.sha }}
        run: |
          # "0.<N> (<pull requests in this build and not in the previous release's>)", "0.<N>.<M> (...)"
          # when every one of them is from a hotfix branch (hf-*), and the changelog for the notes.
          set -euo pipefail
          script=packaging/windows/release_name.py
          tmp="$RUNNER_TEMP"
          gh release list --repo "$REPO" --limit 200 --json name,tagName > "$tmp/releases.json"
          previous=$(python3 "$script" previous --releases "$tmp/releases.json")
          echo "[]" > "$tmp/pulls.json"
          if [ -n "$previous" ]; then
            read -r previous_core previous_br <<< "$previous"
            # Core first, then plugin; each in merge order. Only what this build contains.
            for pair in "$CORE_REPO $previous_core $CORE_SHA" "$REPO $previous_br $BR_SHA"; do
              read -r repo base head <<< "$pair"
              gh api "repos/$repo/compare/$base...$head" --jq '[.commits[].commit.message]' > "$tmp/messages.json"
              for number in $(python3 "$script" pulls --messages "$tmp/messages.json"); do
                gh api "repos/$repo/pulls/$number" \
                  --jq "{repo: \"$repo\", number, title, branch: .head.ref, body, url: .html_url}"
              done
            done | jq -s . > "$tmp/pulls.json"
          fi
          name=$(python3 "$script" name --releases "$tmp/releases.json" --pulls "$tmp/pulls.json")
          python3 "$script" notes --pulls "$tmp/pulls.json" --version "${name%% *}" \
            --install "https://github.com/$REPO/releases/latest/download/terrascope-br.json" > "$tmp/notes.md"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "release name: $name"
          cat "$tmp/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          LATEST: ${{ needs.build.outputs.latest }}
          REPO: ${{ github.repository }}
          TITLE: ${{ steps.title.outputs.name }}
        run: |
          # Every file in one call: the zip and its manifest appear together.
          gh release create "$TAG" release/* --repo "$REPO" --target "${{ github.sha }}" \
            --latest="$LATEST" --prerelease="$([ "$LATEST" = true ] && echo false || echo true)" \
            --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Keep the newest builds only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$REPO" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("windows-"))] | sort_by(.createdAt) | reverse | .[env.KEEP_RELEASES | tonumber:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --repo "$REPO" --cleanup-tag --yes
          done
