name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The plugin needs a Terrascope core with plugin support, which PyPI does not
      # have yet: install the core from the main branch of its repository.
      - name: Install the core and the plugin
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "terrascope @ git+https://github.com/fernandoaugusto21/Terrascope@main"
          python -m pip install -e ".[dev]"

      - name: Check the plugin loads
        run: python -m terrascope_br

      - name: Tests
        run: python -m pytest -q
